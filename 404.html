<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Redirigiendo a NEXOS IA…</title>
  <!-- Redirect instantáneo vía meta refresh -->
  <meta http-equiv="refresh" content="0; url=https://nexos-ia.com/">
  <!-- Redirect via JS como respaldo -->
  <script>window.location.replace("https://nexos-ia.com/");</script>
  <!-- Canonical para SEO: indica a Google que la URL correcta es la nueva -->
  <link rel="canonical" href="https://nexos-ia.com/">
</head>
<body>
  <p>Redirigiendo a <a href="https://nexos-ia.com/">nexos-ia.com</a>…</p>
</body>
</html>
